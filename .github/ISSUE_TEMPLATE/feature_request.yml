name: Feature request
description: Suggest an improvement or a new connector / mapping.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: market
    attributes:
      label: Market / regulation this relates to
      multiple: true
      options: [International, Vietnam, Korea, Japan, Other]
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits a self-hosted tool (no hosted SaaS / billing features).
          required: true
