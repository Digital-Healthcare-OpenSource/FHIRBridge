name: Publish Docker images to GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One image failing its scan must not stop the other from shipping.
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: ./Dockerfile
          - component: web
            dockerfile: ./docker/web/Dockerfile
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)

    steps:
      - uses: actions/checkout@v6

      # OCI references must be lowercase; the org name is mixed-case
      # (Digital-Healthcare-OpenSource), which cosign rejects when interpolated
      # raw. metadata-action lowercases internally — cosign does not.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fhirbridge-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # ── Gate: build the native (amd64) image locally and scan it BEFORE any
      # push. A CRITICAL/HIGH vulnerability fails the job so nothing ships.
      - name: Build image for scan (amd64, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: fhirbridge-${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fhirbridge-${{ matrix.component }}:scan
          format: table
          exit-code: '1' # fail the job on findings
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max # SLSA build provenance attestation
          sbom: true # attach an SPDX SBOM attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless / Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
