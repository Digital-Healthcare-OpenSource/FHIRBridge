# FHIRBridge web UI + API reverse proxy (plain HTTP inside the compose network).
# Put a TLS-terminating proxy in front before exposing this beyond localhost —
# see docs/operations/reverse-proxy.md.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 50 MB CSV / Excel uploads + multipart overhead (API enforces the real limit)
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-critical: NDJSON exports and uploads must not be buffered
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Content-hashed Vite assets — cache forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # SPA: client-side routes fall back to index.html, which is never cached
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
